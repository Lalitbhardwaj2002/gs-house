<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 132' width='220' height='132' role='img'><title>A group G split into the cosets H, aH, bH, cH of equal size</title><rect width='220' height='132' fill='#ffffff'/><text x='110' y='16' font-family='Georgia, "Times New Roman", serif' font-size='13' font-style='italic' text-anchor='middle' fill='#2f2a24'>G</text><rect x='30' y='24' width='40' height='78' fill='#fbd9b3' stroke='#2f2a24' stroke-width='1.1'/><text x='50' y='68' font-family='Georgia, "Times New Roman", serif' font-size='12' font-style='italic' text-anchor='middle' fill='#2f2a24'>H</text><rect x='70' y='24' width='40' height='78' fill='#dcdcf6' stroke='#2f2a24' stroke-width='1.1'/><text x='90' y='68' font-family='Georgia, "Times New Roman", serif' font-size='12' font-style='italic' text-anchor='middle' fill='#2f2a24'>aH</text><rect x='110' y='24' width='40' height='78' fill='#c9c9f2' stroke='#2f2a24' stroke-width='1.1'/><text x='130' y='68' font-family='Georgia, "Times New Roman", serif' font-size='12' font-style='italic' text-anchor='middle' fill='#2f2a24'>bH</text><rect x='150' y='24' width='40' height='78' fill='#b4b4ee' stroke='#2f2a24' stroke-width='1.1'/><text x='170' y='68' font-family='Georgia, "Times New Roman", serif' font-size='12' font-style='italic' text-anchor='middle' fill='#2f2a24'>cH</text><text x='110' y='122' font-family='Georgia, "Times New Roman", serif' font-size='11' text-anchor='middle' fill='#2f2a24'>equal-size, non-overlapping cosets</text></svg>
