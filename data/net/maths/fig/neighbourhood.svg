<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 72' width='300' height='72' role='img'><title>An open neighbourhood (a − ε, a + ε) and a closed interval [c, d] on the line</title><rect width='300' height='72' fill='#ffffff'/><defs><marker id='nl' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#2f2a24'/></marker></defs><line x1='10' y1='40' x2='290' y2='40' stroke='#2f2a24' stroke-width='1.1' marker-end='url(#nl)'/><rect x='60' y='35' width='70' height='10' fill='#c9cdf5'/><text x='56' y='45' font-family='Georgia, "Times New Roman", serif' font-size='18' fill='#2f2a24'>(</text><text x='128' y='45' font-family='Georgia, "Times New Roman", serif' font-size='18' fill='#2f2a24'>)</text><circle cx='95' cy='40' r='2.6' fill='#2f2a24'/><rect x='180' y='35' width='70' height='10' fill='#fbd9b3'/><text x='176' y='45' font-family='Georgia, "Times New Roman", serif' font-size='18' fill='#2f2a24'>[</text><text x='247' y='45' font-family='Georgia, "Times New Roman", serif' font-size='18' fill='#2f2a24'>]</text><text x='95' y='18' font-family='Georgia, "Times New Roman", serif' font-size='11' text-anchor='middle' fill='#2f2a24'>ε-neighbourhood of <tspan font-style="italic">a</tspan></text><text x='215' y='18' font-family='Georgia, "Times New Roman", serif' font-size='11' text-anchor='middle' fill='#2f2a24'>closed interval [<tspan font-style="italic">c</tspan>, <tspan font-style="italic">d</tspan>]</text><text x='60' y='62' font-family='Georgia, "Times New Roman", serif' font-size='11' text-anchor='middle' fill='#2f2a24'><tspan font-style="italic">a</tspan> − ε</text><text x='95' y='62' font-family='Georgia, "Times New Roman", serif' font-size='11' text-anchor='middle' fill='#2f2a24' font-style="italic">a</text><text x='130' y='62' font-family='Georgia, "Times New Roman", serif' font-size='11' text-anchor='middle' fill='#2f2a24'><tspan font-style="italic">a</tspan> + ε</text></svg>
