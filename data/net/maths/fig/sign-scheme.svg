<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 260 78' width='260' height='78' role='img'><title>Sign scheme of f′(x): positive before −2, negative between −2 and 3, positive after 3</title><rect width='260' height='78' fill='#ffffff'/><defs><marker id='sx' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#2f2a24'/></marker></defs><line x1='10.0' y1='34.0' x2='250.0' y2='34.0' stroke='#2f2a24' stroke-width='1.2'/><line x1='240' y1='34' x2='252' y2='34' stroke='#2f2a24' stroke-width='1.2' marker-end='url(#sx)'/><circle cx='90.0' cy='34.0' r='3' fill='#2f2a24'/><circle cx='170.0' cy='34.0' r='3' fill='#2f2a24'/><text x='90' y='52' font-family='Georgia, "Times New Roman", serif' font-size='11' text-anchor='middle' fill='#2f2a24'>−2</text><text x='170' y='52' font-family='Georgia, "Times New Roman", serif' font-size='11' text-anchor='middle' fill='#2f2a24'>3</text><text x='48' y='24' font-family='Georgia, "Times New Roman", serif' font-size='13' text-anchor='middle' fill='#2f2a24'>+</text><text x='130' y='24' font-family='Georgia, "Times New Roman", serif' font-size='13' text-anchor='middle' fill='#2f2a24'>−</text><text x='212' y='24' font-family='Georgia, "Times New Roman", serif' font-size='13' text-anchor='middle' fill='#2f2a24'>+</text><text x='130' y='70' font-family='Georgia, "Times New Roman", serif' font-size='11' text-anchor='middle' fill='#2f2a24'>sign scheme of f′(x)</text></svg>
