<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 100' width='360' height='100' role='img'><title>Two circles: separate (4 common tangents), touching externally (3), intersecting (2), touching internally (1), one inside the other (0)</title><rect width='360' height='100' fill='#ffffff'/><circle cx='30.0' cy='40.0' r='20.0' fill='none' stroke='#2a4fa8' stroke-width='1.5'/><circle cx='68.0' cy='40.0' r='12.0' fill='none' stroke='#b3261e' stroke-width='1.5'/><text x='36.0' y='78.0' font-family='Georgia, "Times New Roman", serif' font-size='8' text-anchor='middle' fill='#2f2a24'>separate</text><text x='36.0' y='90.0' font-family='Georgia, "Times New Roman", serif' font-size='8' text-anchor='middle' fill='#2f2a24'>4 tangents</text><circle cx='102.0' cy='40.0' r='20.0' fill='none' stroke='#2a4fa8' stroke-width='1.5'/><circle cx='134.0' cy='40.0' r='12.0' fill='none' stroke='#b3261e' stroke-width='1.5'/><text x='108.0' y='78.0' font-family='Georgia, "Times New Roman", serif' font-size='8' text-anchor='middle' fill='#2f2a24'>touch externally</text><text x='108.0' y='90.0' font-family='Georgia, "Times New Roman", serif' font-size='8' text-anchor='middle' fill='#2f2a24'>3 tangents</text><circle cx='174.0' cy='40.0' r='20.0' fill='none' stroke='#2a4fa8' stroke-width='1.5'/><circle cx='196.0' cy='40.0' r='12.0' fill='none' stroke='#b3261e' stroke-width='1.5'/><text x='180.0' y='78.0' font-family='Georgia, "Times New Roman", serif' font-size='8' text-anchor='middle' fill='#2f2a24'>intersect</text><text x='180.0' y='90.0' font-family='Georgia, "Times New Roman", serif' font-size='8' text-anchor='middle' fill='#2f2a24'>2 tangents</text><circle cx='246.0' cy='40.0' r='20.0' fill='none' stroke='#2a4fa8' stroke-width='1.5'/><circle cx='254.0' cy='40.0' r='12.0' fill='none' stroke='#b3261e' stroke-width='1.5'/><text x='252.0' y='78.0' font-family='Georgia, "Times New Roman", serif' font-size='8' text-anchor='middle' fill='#2f2a24'>touch internally</text><text x='252.0' y='90.0'